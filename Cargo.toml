[package]
name = "maitred"
version = "0.1.0"
edition = "2024"
description = "OpenAI-compatible /v1 front for self-hosted LLM servers that share GPUs: virtual keys, routing, model metadata, reasoning-effort translation, and errors that say what is being served instead"
repository = "https://github.com/ewtodd/maitred"
readme = "README.md"
keywords = ["llm", "openai", "gateway", "proxy", "self-hosted"]
categories = ["web-programming::http-server"]
license = "MIT"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "query"] }
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync", "process", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "ansi"] }

[profile.release]
lto = "thin"
codegen-units = 4
